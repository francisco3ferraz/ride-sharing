name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # On pull requests: lint, format check, and breaking-change check against the base branch.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          push: false
          pr_comment: false

      - name: Check generated code is up to date
        run: |
          buf generate
          if [ -n "$(git status --porcelain gen)" ]; then
            echo "gen/ is out of date. Run 'make generate' and commit the result."
            git status --porcelain gen
            exit 1
          fi
