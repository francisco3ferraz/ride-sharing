openapi: 3.0.4
info:
  title: Ride-sharing API
  description: >-
    The public REST API of the Lisbon ride-sharing app, served by the Edge. A request
    other than GET, HEAD or OPTIONS that a browser sends from another origin gets a 403.
    Requests are rate limited per client address, a logged-in user's per user too, and
    some routes have stricter limits of their own. A request over a limit gets a 429.
    A request that a busy or unreachable service can't answer gets a 503.
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: https://ride-sharing.localhost
    description: The local cluster, through Traefik

# Every operation needs the access token unless it declares `security: []`, so a route
# that forgets to opt out answers 401 instead of being open by mistake.
security:
  - CookieAuth: []

paths:
  /v1/fare-estimate:
    get:
      operationId: getFareEstimate
      summary: Returns an estimate of a ride.
      security: []
      parameters:
        - name: distance_meters
          in: query
          description: Trip distance in meters.
          required: true
          schema:
            type: integer
            format: int32
        - name: duration_seconds
          in: query
          description: Trip duration in seconds.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FareEstimate"
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/register:
    post:
      operationId: registerUser
      summary: Creates a rider or driver account, and logs it in.
      description: A taken email gets a 409.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account was created, and its session started.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/login:
    post:
      operationId: login
      summary: Checks an email and password, and starts a session for their user.
      description: >-
        An unknown email and a wrong password get the same 401, so the response doesn't
        reveal which emails are registered. Five failed logins for one email from one
        address within 15 minutes lock that pair out for 15 minutes: its logins get a 429
        with no Retry-After, registered email or not, until then or until a password
        reset.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The email and password match, and the session started.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # Refresh and logout run on the refresh cookie alone: by the time the web app calls
  # them, the access token has usually expired.
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Replaces both session cookies with new ones.
      description: >-
        A missing, unknown, expired or revoked refresh token gets a 401, and so does one
        that was already used, which also ends its session: someone else holds a token
        from it.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenCookie"
      responses:
        "204":
          description: The session continues, with new tokens.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Ends the session, and clears both session cookies.
      description: >-
        It succeeds without a refresh token, or with one that's unknown or already
        revoked. After a 500 the cookies stay, so the client can retry.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenCookie"
      responses:
        "204":
          description: The session has ended.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ExpiredSessionCookies"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Emails a link to reset the password, if the email is registered.
      description: >-
        Every request gets the same 202, so the response doesn't reveal which emails are
        registered. The link, valid for an hour, opens the web app's /reset-password page
        with the token in the URL's fragment. Asking again makes older links stop working.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "202":
          description: If the email is registered, a link is on its way.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/password-reset/confirm:
    post:
      operationId: resetPassword
      summary: Sets a new password with the token from a reset link, and ends every session.
      description: >-
        An unknown, used or expired token gets a 400, as does a password that breaks the
        rule. Access tokens already issued keep working until they expire. Logins locked
        out for the email, from any address, are let in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password is changed, and the user's sessions have ended.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me:
    get:
      operationId: getMe
      summary: Returns the logged-in user.
      description: >-
        The user is the access token's, so there's nothing to send but the cookie. A
        missing, invalid or expired access token gets a 401.
      responses:
        "200":
          description: The user the access token belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateMe
      summary: Changes the logged-in user's profile.
      description: >-
        Fields left out stay as they are, so an empty object changes nothing. A field
        the request can't change, or a null, gets a 400. A missing, invalid or expired
        access token gets a 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The user, with the changes made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # Public, so a signup form can show it before the account exists.
  /v1/vehicle-catalog:
    get:
      operationId: getVehicleCatalog
      summary: Returns the makes, models and colours a driver's vehicle can have.
      description: >-
        In the order a form should list them. A vehicle's make, model and colour must be
        spelt exactly as they are here.
      security: []
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleCatalog"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  headers:
    RetryAfter:
      description: How many seconds to wait before trying again.
      schema:
        type: integer
        format: int32
    # Both optional on purpose. oapi-codegen writes a required header with Header().Set,
    # which would replace the cookies the handler sets with http.SetCookie. Optional,
    # its generated SetCookie field stays nil and the generated code writes nothing.
    SessionCookies:
      description: >-
        Two HttpOnly cookies, in one Set-Cookie header each: the access token, sent with
        every request and valid for 15 minutes, and the refresh token, sent only to
        /v1/auth. JavaScript can't read either.
      schema:
        type: string
    ExpiredSessionCookies:
      description: Both session cookies, with Max-Age=0 so the browser deletes them.
      schema:
        type: string
  parameters:
    RefreshTokenCookie:
      name: __Secure-refresh_token
      x-go-name: RefreshToken
      in: cookie
      # Optional, so a missing cookie gets Identity's 401 rather than the validator's 400.
      required: false
      description: >-
        The refresh token, which register, login and refresh set as an HttpOnly cookie,
        sent only to /v1/auth.
      schema:
        type: string
  securitySchemes:
    CookieAuth:
      description: The access token, which register, login and refresh set as an HttpOnly cookie.
      type: apiKey
      in: cookie
      name: __Host-access_token
  responses:
    Problem:
      description: An error, in the RFC 9457 problem details format.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        A rate limit is used up, or a login is locked out, in the RFC 9457 problem details
        format. For a rate limit, Retry-After says when to try again.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: >-
        A service the request needs is too busy to take it, or can't be reached, in the
        RFC 9457 problem details format. Nothing was done, so the request can be sent
        again a moment later. Registration, login and password reset are turned away
        this way when more arrive than can have their passwords hashed in time.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    FareEstimate:
      type: object
      required: [fare_cents]
      properties:
        fare_cents:
          type: integer
          format: int64
          description: The estimated fare, in euro cents.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        # No format: email here. A malformed email gets the same 401 as any other wrong
        # one, and a stricter format later can't lock out users registered before it.
        email:
          type: string
        password:
          type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI naming the kind of problem, or about:blank when the status code says enough.
        title:
          type: string
          description: A short summary of the kind of problem.
        status:
          type: integer
          format: int32
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this particular request.
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        # No minLength or maxLength: Identity owns the rule, and its 400 says which part
        # failed. The description is for clients building a form.
        password:
          type: string
          description: 15 to 128 characters, with no other rules.
        role:
          $ref: "#/components/schemas/Role"
    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        # No format: email, as in LoginRequest. A malformed email gets the same 202 and no
        # link.
        email:
          type: string
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The token from the reset link's fragment.
        password:
          type: string
          description: The new password. 15 to 128 characters, with no other rules.
    Role:
      type: string
      enum: [rider, driver]
    UpdateMeRequest:
      type: object
      # Otherwise a misspelt field is ignored, and the change silently not made.
      additionalProperties: false
      # Not nullable: the generated code reads null as nil, the same as a missing field.
      properties:
        # No length limits: Identity owns the rule.
        name:
          type: string
          description: >-
            The name shown to the other person on a trip. It's trimmed, and must then be 1
            to 50 characters with no control characters.
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        # No format: email. oapi-codegen's Email type checks the address again while
        # encoding, and a stored email failing that check would make its login a 500.
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
          description: Left out until the user sets one.
    VehicleCatalog:
      type: object
      required: [makes, colours]
      properties:
        makes:
          type: array
          items:
            $ref: "#/components/schemas/VehicleMake"
        colours:
          type: array
          items:
            type: string
    VehicleMake:
      type: object
      required: [name, models]
      properties:
        name:
          type: string
        models:
          type: array
          items:
            type: string
