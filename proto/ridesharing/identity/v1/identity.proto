syntax = "proto3";
package ridesharing.identity.v1;

import "google/protobuf/timestamp.proto";

service IdentityService {
  // Creates a user and starts their session. Fails with INVALID_ARGUMENT for an empty
  // email, a password that breaks the rule or an unspecified role, and ALREADY_EXISTS
  // for a taken email.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Starts a session for the user. Fails with UNAUTHENTICATED for an unknown email or a
  // wrong password alike.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Returns the user with the given ID. Fails with INVALID_ARGUMENT for an ID that isn't
  // a UUID, and NOT_FOUND when no user has it. It doesn't check who's asking, so callers
  // pass only an ID they've authenticated, such as a verified access token's subject.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_DRIVER = 1;
  ROLE_RIDER = 2;
}

message User {
  string id = 1;
  string email = 2;
  Role role = 3;
}

// A JWT signed with EdDSA. Whoever holds it can read its claims, so it carries nothing
// private.
message AccessToken {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// An opaque random value. Identity stores only its SHA-256.
message RefreshToken {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Both tokens are secrets: never log them. The Edge sets each as a cookie that lasts
// until its expires_at.
message Tokens {
  AccessToken access_token = 1;
  RefreshToken refresh_token = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  Role role = 3;
}

message RegisterResponse {
  User user = 1;
  Tokens tokens = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  Tokens tokens = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}
