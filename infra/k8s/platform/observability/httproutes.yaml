# The observability UIs, each on its own subdomain. Loki has no UI; query it in Grafana.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https
  hostnames:
    - grafana.ride-sharing.localhost
  rules:
    - backendRefs:
        - name: grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https
  hostnames:
    - jaeger.ride-sharing.localhost
  rules:
    - backendRefs:
        - name: jaeger
          port: 16686
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https
  hostnames:
    - prometheus.ride-sharing.localhost
  rules:
    - backendRefs:
        - name: prometheus-server
          port: 80
