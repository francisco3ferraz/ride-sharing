syntax = "proto3";
package ridesharing.identity.v1;

import "google/protobuf/timestamp.proto";

// Register, Login and ResetPassword hash a password, and fail with UNAVAILABLE when too
// many are already being hashed. Nothing was done then, so they can be called again
// shortly.
service IdentityService {
  // Creates a user and starts their session. Fails with INVALID_ARGUMENT for an empty
  // email, a password that breaks the rule or an unspecified role, and ALREADY_EXISTS
  // for a taken email.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Starts a session for the user. The caller sends the client's IP address in the
  // client-ip metadata entry, and fails with INTERNAL without it. Fails with
  // UNAUTHENTICATED for an unknown email or a wrong password alike. Failed logins count
  // per email and address, registered or not: five within 15 minutes block that pair
  // for 15 minutes, during which it fails with RESOURCE_EXHAUSTED without its password
  // being checked.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Marks the refresh token used and returns new tokens for the same session. Fails
  // with UNAUTHENTICATED for an unknown, expired, used or revoked token alike. A used
  // one also revokes the session, since someone else holds a token from it.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Revokes the session the refresh token belongs to. An unknown token, or one whose
  // session is already revoked, isn't an error.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Returns the user with the given ID. Fails with INVALID_ARGUMENT for an ID that isn't
  // a UUID, and NOT_FOUND when no user has it. It doesn't check who's asking, so callers
  // pass only an ID they've authenticated, such as a verified access token's subject.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Changes the fields the request sets, leaves the rest, and returns the user. A name
  // is trimmed, and must then be 1 to 50 characters with no control characters. Fails
  // with INVALID_ARGUMENT for an ID that isn't a UUID or a name that breaks the rule,
  // and NOT_FOUND when no user has the ID. Like GetUser, it doesn't check who's asking.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Returns the makes, models and colours a driver's vehicle can have, in the order a
  // form lists them.
  rpc GetVehicleCatalog(GetVehicleCatalogRequest) returns (GetVehicleCatalogResponse);
  // Emails the user a link to reset their password, if the email is registered. It
  // succeeds either way, so the caller can't tell which emails are.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  // Sets a new password with the token from a reset link, revokes every session of the
  // user, and lifts every login lockout for their email. Fails with INVALID_ARGUMENT for
  // an unknown, used or expired token alike, and for a password that breaks the rule.
  // The token stays usable after UNAVAILABLE.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_DRIVER = 1;
  ROLE_RIDER = 2;
}

message User {
  string id = 1;
  string email = 2;
  Role role = 3;
  // Empty until the user sets one.
  string name = 4;
}

// A JWT signed with EdDSA. Whoever holds it can read its claims, so it carries nothing
// private.
message AccessToken {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// An opaque random value. Identity stores only its SHA-256.
message RefreshToken {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Both tokens are secrets: never log them. The Edge sets each as a cookie that lasts
// until its expires_at.
message Tokens {
  AccessToken access_token = 1;
  RefreshToken refresh_token = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  Role role = 3;
}

message RegisterResponse {
  User user = 1;
  Tokens tokens = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  Tokens tokens = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  Tokens tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  // optional, so that leaving it out keeps the name rather than emptying it.
  optional string name = 2;
}

message UpdateUserResponse {
  User user = 1;
}

// Names are matched exactly, so a form sends back the ones it was given.
message VehicleMake {
  string name = 1;
  repeated string models = 2;
}

message GetVehicleCatalogRequest {}

message GetVehicleCatalogResponse {
  repeated VehicleMake makes = 1;
  repeated string colours = 2;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {}

// The token is a secret: never log it.
message ResetPasswordRequest {
  string token = 1;
  string password = 2;
}

message ResetPasswordResponse {}
