name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # buf-action checks breaking changes only on pull requests unless told to. On a push,
      # it compares against the commit before the push.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          breaking: true
          push: false
          pr_comment: false

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint the spec
        run: make lint-openapi

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The generators run through `go tool`, pinned in go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true

      # A prebuilt binary, since sqlc isn't in go.mod. Keep in step with SQLC_VERSION in
      # the Makefile, which make generate checks.
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.31.1

      # Regenerates everything; any change, or any new file, means a commit forgot it.
      - name: Check generated code is up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated code is out of date. Run 'make generate' and commit the result."
            git status --porcelain
            exit 1
          fi
