# Sends https://ride-sharing.localhost/v1/... to the Edge. /healthz stays internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https
  hostnames:
    - ride-sharing.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: edge
          port: 8080
